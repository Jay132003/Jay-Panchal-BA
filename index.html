<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jay Panchal - Business Analyst and Solutions Engineer specializing in workflow automation." />
    <title>Jay Panchal | Business Analyst & Solutions Engineer</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Apply saved theme before first paint to prevent colour flash -->
    <script>
      try {
        var t = localStorage.getItem('jay-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

    <!-- Static splash — the preloader's first frame, painted before React
         mounts so the greetings hand-off is seamless (zero blink). -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        background: #fafafa;
      }
      html.dark #splash { background: #111111; }

      #splash p {
        margin: 0;
        text-align: center;
        color: #111111;
        font-family: Inter, system-ui, "Segoe UI", sans-serif;
        font-weight: 500;
        font-size: clamp(1.9rem, 7vw, 3.1rem);
        line-height: 1;
        letter-spacing: -0.02em;
        opacity: 0;
        animation: sp-fade 500ms ease forwards 60ms;
      }
      html.dark #splash p { color: #f3f3f3; }

      @keyframes sp-fade {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <!-- Static splash rendered before React — zero blink on load/refresh -->
    <div id="splash"><p>Hello</p></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
