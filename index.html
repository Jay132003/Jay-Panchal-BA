<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jay Panchal - Business Analyst and Solutions Engineer specializing in workflow automation." />
    <title>Jay Panchal | Business Analyst & Solutions Engineer</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Apply saved theme before first paint to prevent colour flash -->
    <script>
      try {
        var t = localStorage.getItem('jay-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

    <!-- Static splash — the preloader's first frame (a blank page in the site's
         colour), painted before React mounts so the signature write-on
         starts without a blink. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #ffffff;
      }
      html.dark #splash { background: #0a0a0a; }
    </style>
  </head>
  <body>
    <!-- Static splash rendered before React — zero blink on load/refresh -->
    <div id="splash"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
